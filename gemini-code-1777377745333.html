<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>计算机网络半学期知识汇总测评</title>
    <style>
        :root { --primary: #2c3e50; --success: #27ae60; --error: #e74c3c; --bg: #f4f7f6; }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: -apple-system, sans-serif; background: var(--bg); }
        .app-container { display: flex; flex-direction: column; height: 100%; max-width: 600px; margin: 0 auto; background: #fff; position: relative; }
        
        /* 登录页 */
        #page-login { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; background: var(--primary); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }
        .login-box { width: 80%; text-align: center; }
        .login-box input { width: 100%; padding: 15px; margin: 20px 0; border-radius: 10px; border: none; font-size: 1rem; box-sizing: border-box; text-align: center; outline: none; }
        .login-btn { width: 100%; padding: 15px; background: var(--success); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; }

        /* 顶部导航 */
        header { padding: 15px; background: var(--primary); color: white; display: flex; align-items: center; justify-content: space-between; font-size: 13px; height: 60px; box-sizing: border-box; visibility: hidden; }
        .logout-link { color: #ff7675; cursor: pointer; font-weight: bold; font-size: 11px; border: 1px solid #ff7675; padding: 2px 6px; border-radius: 4px; margin-left: 10px; }
        .progress-bar { height: 6px; background: #455a64; flex-grow: 1; margin: 0 15px; border-radius: 3px; overflow: hidden; }
        .progress-inner { height: 100%; background: var(--success); width: 0%; transition: 0.3s; }

        /* 内容区 */
        .content-area { flex: 1; position: relative; overflow: hidden; }
        .page { display: none; flex-direction: column; width: 100%; height: 100%; background: #fff; box-sizing: border-box; }
        .active-page { display: flex; }

        /* 章节列表 */
        .menu-list { padding: 20px; overflow-y: auto; }
        .chapter-card { background: #fff; border: 1px solid #eee; padding: 18px; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .chapter-info h3 { margin: 0 0 5px 0; color: #333; font-size: 1rem; }
        .high-score { color: #f39c12; font-weight: bold; font-size: 0.8rem; }
        .start-btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; }

        /* 做题区 */
        .quiz-area { flex: 1; overflow-y: auto; padding: 25px; }
        .question-text { font-size: 1.15rem; font-weight: bold; margin-bottom: 25px; color: #333; line-height: 1.6; }
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { padding: 18px; border: 2px solid #f0f0f0; border-radius: 12px; font-size: 1rem; background: #fff; cursor: pointer; transition: 0.2s; -webkit-tap-highlight-color: transparent; }
        .correct { background: #e8f5e9 !important; border-color: var(--success) !important; color: #2e7d32; font-weight: bold; }
        .wrong { background: #ffebee !important; border-color: var(--error) !important; color: #c62828; }
        .disabled { pointer-events: none; }

        .analysis-card { margin-top: 20px; padding: 15px; border-radius: 10px; font-size: 0.95rem; display: none; line-height: 1.6; }
        .correct-analysis { background: #f1f8e9; color: #33691e; border: 1px solid #c5e1a5; }
        .wrong-analysis { background: #fff3e0; color: #e65100; border: 1px solid #ffe0b2; }

        footer { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; background: white; }
        .nav-btn { flex: 1; padding: 15px; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        #next-btn { background: #3498db; color: white; display: none; }
        #back-btn { background: #ecf0f1; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="page-login">
        <div class="login-box">
            <h2>计算机网络测评系统</h2>
            <p style="opacity:0.8; font-size:14px;">半学期知识汇总 (2026版)</p>
            <input type="text" id="user-name-input" placeholder="输入您的姓名" maxlength="10">
            <button class="login-btn" onclick="login()">开始挑战</button>
        </div>
    </div>

    <header id="main-header">
        <div class="user-info">
            <span id="display-name">--</span>
            <span class="logout-link" onclick="logout()">退出清除</span>
        </div>
        <div class="progress-bar"><div class="progress-inner" id="progress"></div></div>
        <span id="q-indicator" style="min-width:35px; text-align:right;"></span>
    </header>

    <div class="content-area">
        <div id="page-home" class="page">
            <div class="menu-list" id="chapter-list"></div>
        </div>

        <div id="page-quiz" class="page">
            <div class="quiz-area">
                <div class="question-text" id="q-text"></div>
                <div id="options" class="options-list"></div>
                <div id="analysis-box" class="analysis-card">
                    <div id="analysis-head" style="font-weight:bold; margin-bottom:5px;"></div>
                    <div id="analysis-body"></div>
                </div>
            </div>
            <footer>
                <button id="back-btn" class="nav-btn" onclick="goHome()">返回目录</button>
                <button id="next-btn" class="nav-btn" onclick="nextQuestion()">下一题</button>
            </footer>
        </div>
    </div>
</div>

<script>
    // 整合文档及图片内容的题库
    const database = [
            {
    name: "练习1：基础概念与性能 (1-20题)",
    questions: [
        { q: "计算机网络最基本的功能是？", a: "资源共享", ops: ["分布式处理", "资源共享", "数据存储", "负载均衡"], analysis: "解析：资源共享（包括硬件、软件和数据资源）是计算机网络产生和发展的根本目的 [cite: 10]。" },
        { q: "世界上第一个计算机网络是？", a: "ARPANET", ops: ["ARPANET", "ChinaNet", "Internet", "CERNET"], analysis: "解析：ARPANET（阿帕网）是现代互联网的前身，也是全球第一个分组交换网络 [cite: 11]。" },
        { q: "计算机网络由哪两部分组成？", a: "通信子网和资源子网", ops: ["硬件系统和软件系统", "通信子网和资源子网", "主机和终端", "服务器和客户机"], analysis: "解析：从逻辑功能上划分，网络由负责数据传输的通信子网和负责数据处理的资源子网组成 [cite: 12]。" },
        { q: "按覆盖范围，校园网属于？", a: "LAN", ops: ["LAN", "MAN", "WAN", "VPN"], analysis: "解析：LAN（局域网）通常覆盖几公里以内的范围，校园网是典型的局域网 [cite: 13]。" },
        { q: "广域网的主要交换技术是？", a: "分组交换", ops: ["电路交换", "分组交换", "报文交换", "帧交换"], analysis: "解析：广域网核心采用存储转发的分组交换技术，以提高信道利用率 [cite: 14]。" },
        { q: "下列属于有线传输介质的是？", a: "光纤", ops: ["蓝牙", "光纤", "Wi-Fi", "红外线"], analysis: "解析：光纤通过实体线缆传输信号，属于有线介质；其他三项均为无线传输 [cite: 15]。" },
        { q: "拓扑结构中，单点故障不影响全网的是？", a: "总线型", ops: ["总线型", "星型", "环型", "树型"], analysis: "解析：在总线型结构中，单一节点失效不会影响整个总线的通信（除非总线本身断裂）[cite: 16]。" },
        { q: "可靠性最高的拓扑结构是？", a: "网状型", ops: ["星型", "环型", "网状型", "树型"], analysis: "解析：网状型结构具有冗余路径，即使某条链路中断，数据仍可通过其他路径传输 [cite: 17]。" },
        { q: "传输速率的基本单位是？", a: "bit/s", ops: ["Byte/s", "bit/s", "Hz", "KB"], analysis: "解析：网络带宽和速率的标准单位是比特每秒（bps 或 bit/s）[cite: 18]。" },
        { q: "1字节等于多少比特？", a: "8", ops: ["4", "8", "16", "32"], analysis: "解析：在计算机存储和通信中，1 Byte（字节）固定等于 8 bits（比特）[cite: 19]。" },
        { q: "误码率越低，说明传输？", a: "越可靠", ops: ["越快", "越可靠", "距离越远", "带宽越大"], analysis: "解析：误码率是衡量数据传输准确性的指标，数值越低代表传输质量越可靠 [cite: 20]。" },
        { q: "总时延不包含？", a: "存储时延", ops: ["发送时延", "传播时延", "存储时延", "排队时延"], analysis: "解析：总时延由发送时延、传播时延、处理时延和排队时延组成 [cite: 21]。" },
        { q: "数字信号的特点是？", a: "离散0/1", ops: ["连续波形", "离散0/1", "易失真", "抗干扰弱"], analysis: "解析：数字信号在取值上是离散的，通常用 0 和 1 代表不同的电压状态 [cite: 22]。" },
        { q: "模拟信号的特点是？", a: "连续波形", ops: ["离散非连续", "连续波形", "无失真", "保密性高"], analysis: "解析：模拟信号的参量在给定范围内是连续变化的 [cite: 23]。" },
        { q: "单工通信的典型应用是？", a: "广播", ops: ["电话", "对讲机", "广播", "网络"], analysis: "解析：广播是典型的单向传输方式，属于单工通信 [cite: 24]。" },
        { q: "对讲机属于哪种通信方式？", a: "半双工", ops: ["单工", "半双工", "全双工", "并行"], analysis: "解析：对讲机允许双方通信，但同一时间只能由一方发送，另一方接收 [cite: 25]。" },
        { q: "全双工通信需要几条独立信道？", a: "2", ops: ["1", "2", "3", "4"], analysis: "解析：为了实现同时双向传输，全双工通常需要两条独立的逻辑或物理信道 [cite: 26]。" },
        { q: "局域网常用传输技术是？", a: "基带传输", ops: ["基带传输", "频带传输", "宽带传输", "信元传输"], analysis: "解析：局域网（如以太网）多采用基带传输，即直接传输未经调制的数字脉冲信号 [cite: 27]。" },
        { q: "编码是将？", a: "数字数据→数字信号", ops: ["数字数据→数字信号", "数字数据→模拟信号", "模拟数据→数字信号", "模拟数据→模拟信号"], analysis: "解析：编码是指将数字数据转换为适合在数字信道上传输的数字信号的过程 [cite: 28]。" },
        { q: "调制是将？", a: "数字数据→模拟信号", ops: ["数字数据→数字信号", "数字数据→模拟信号", "模拟数据→数字信号", "模拟数据→模拟信号"], analysis: "解析：调制是指将数字信号加载到模拟载波上，以适应模拟信道的传输 [cite: 29]。" }
    ]
},
{
    name: "练习2：数据通信基础 (21-40题)",
    questions: [
        { q: "总时延不包含？", a: "存储时延", ops: ["发送时延", "传播时延", "存储时延", "排队时延"], analysis: "解析：总时延由发送时延、传播时延、处理时延和排队时延四部分组成 [cite: 21]。" },
        { q: "数字信号的特点是？", a: "离散0/1", ops: ["连续波形", "离散0/1", "易失真", "抗干扰弱"], analysis: "解析：数字信号在取值上是离散的，通常用 0 和 1 代表不同的电平状态 [cite: 22]。" },
        { q: "模拟信号的特点是？", a: "连续波形", ops: ["离散非连续", "连续波形", "无失真", "保密性高"], analysis: "解析：模拟信号的参量取值在时间上是连续变化的 [cite: 23]。" },
        { q: "单工通信的典型应用是？", a: "广播", ops: ["电话", "对讲机", "广播", "网络"], analysis: "解析：广播是单向传输，只能由发送端传向接收端，属于单工通信 [cite: 24]。" },
        { q: "对讲机属于哪种通信方式？", a: "半双工", ops: ["单工", "半双工", "全双工", "并行"], analysis: "解析：对讲机允许双方通信，但同一时刻只能有一方发送数据 [cite: 25]。" },
        { q: "全双工通信需要几条独立信道？", a: "2", ops: ["1", "2", "3", "4"], analysis: "解析：全双工需要两个独立的信道分别负责两个方向的同时传输 [cite: 26]。" },
        { q: "局域网常用传输技术是？", a: "基带传输", ops: ["基带传输", "频带传输", "宽带传输", "信元传输"], analysis: "解析：局域网通常直接传输数字信号的原始频率，即基带传输 [cite: 27]。" },
        { q: "编码是将？", a: "数字数据→数字信号", ops: ["数字数据→数字信号", "数字数据→模拟信号", "模拟数据→数字信号", "模拟数据→模拟信号"], analysis: "解析：编码是指将数字数据转换为数字信号的过程 [cite: 28]。" },
        { q: "调制是将？", a: "数字数据→模拟信号", ops: ["数字数据→数字信号", "数字数据→模拟信号", "模拟数据→数字信号", "模拟数据→模拟信号"], analysis: "解析：调制是将数字信号转换成适合在模拟信道传输的模拟信号的过程 [cite: 29]。" },
        { q: "有线电视采用的复用技术是？", a: "FDM", ops: ["FDM", "TDM", "WDM", "CDMA"], analysis: "解析：频分复用（FDM）将信道带宽划分为多个频段，有线电视常用此技术 [cite: 30]。" },
        { q: "以太网采用的复用技术是？", a: "TDM", ops: ["FDM", "TDM", "WDM", "CDMA"], analysis: "解析：以太网在时间上划分信道资源，属于时分复用（TDM）范畴 [cite: 31]。" },
        { q: "光纤通信专用复用技术是？", a: "WDM", ops: ["FDM", "TDM", "WDM", "CDMA"], analysis: "解析：波分复用（WDM）是在光纤中同时传输多个不同波长光信号的技术 [cite: 32]。" },
        { q: "3G/4G移动通信使用的复用技术是？", a: "CDMA", ops: ["FDM", "TDM", "WDM", "CDMA"], analysis: "解析：码分多址（CDMA）通过不同的码片序列区分用户，是移动通信的核心技术 [cite: 33]。" },
        { q: "OSI参考模型由哪个组织提出？", a: "ISO", ops: ["IEEE", "ISO", "IETF", "IBM"], analysis: "解析：国际标准化组织（ISO）提出了著名的 OSI 七层参考模型 [cite: 34]。" },
        { q: "OSI模型共分为几层？", a: "7", ops: ["4", "5", "7", "9"], analysis: "解析：OSI 参考模型从下到上分为物理层、链路层、网络层、传输层、会话层、表示层、应用层共 7 层 [cite: 35]。" },
        { q: "OSI参考模型的最底层是？", a: "物理层", ops: ["物理层", "数据链路层", "网络层", "应用层"], analysis: "解析：物理层是 OSI 模型的第一层，负责透明传输比特流 [cite: 36]。" },
        { q: "OSI参考模型的最顶层是？", a: "应用层", ops: ["物理层", "数据链路层", "网络层", "应用层"], analysis: "解析：应用层是最高层（第七层），直接面向用户提供服务 [cite: 37]。" },
        { q: "物理层的核心功能是？", a: "物理连接", ops: ["路由选择", "物理连接", "帧封装", "数据加密"], analysis: "解析：物理层主要定义物理接口特性及建立、维护物理连接 [cite: 38]。" },
        { q: "数据链路层的数据传输单元是？", a: "帧", ops: ["比特", "帧", "分组", "报文"], analysis: "解析：物理层传比特，链路层则将数据封装成“帧”进行传输 [cite: 39]。" },
        { q: "网络层的核心功能是？", a: "路由选择", ops: ["物理连接", "路由选择", "差错控制", "会话管理"], analysis: "解析：网络层负责在不同网络间进行路径选择（路由） [cite: 40]。" }
    ]
},
            {
            name: "练习3：OSI/TCP-IP模型与层次功能 (41-60题)",
            questions: [
            { q: "传输层的核心作用是？", a: "端到端传输", ops: ["端到端传输", "链路传输", "物理传输", "应用服务"], analysis: "解析：传输层提供应用进程之间的逻辑通信，即端到端的服务 [cite: 41]。" },
            { q: "负责数据加密、压缩和格式转换的是OSI模型的？", a: "表示层", ops: ["应用层", "表示层", "会话层", "传输层"], analysis: "解析：表示层主要处理数据的表示方式，如加密、压缩及格式转换 [cite: 42]。" },
            { q: "HTTP协议属于OSI模型的哪一层？", a: "应用层", ops: ["应用层", "传输层", "网络层", "数据链路层"], analysis: "解析：HTTP是应用层协议，直接为用户的应用进程提供服务 [cite: 43]。" },
            { q: "TCP协议的特点是？", a: "面向连接、可靠", ops: ["无连接、不可靠", "面向连接、可靠", "无连接、可靠", "面向连接、不可靠"], analysis: "解析：TCP提供面向连接的、可靠的字节流传输服务 [cite: 44]。" },
            { q: "UDP协议的特点是？", a: "不可靠、无连接", ops: ["可靠、面向连接", "不可靠、无连接", "可靠、无连接", "不可靠、面向连接"], analysis: "解析：UDP是在IP之上发送数据报，不保证交付且无需建立连接 [cite: 45]。" },
            { q: "ARP协议的作用是？", a: "IP地址→MAC地址", ops: ["IP地址→MAC地址", "MAC地址→IP地址", "域名→IP地址", "IP地址→域名"], analysis: "解析：地址解析协议ARP用于根据已知的IP地址获取对应的物理地址（MAC） [cite: 46]。" },
            { q: "RARP协议的作用是？", a: "MAC地址→IP地址", ops: ["IP地址→MAC地址", "MAC地址→IP地址", "域名→IP地址", "IP地址→域名"], analysis: "解析：逆地址解析协议RARP允许物理机通过MAC地址请求分配IP地址 [cite: 47]。" },
            { q: "TCP/IP模型共分为几层？", a: "4", ops: ["4", "5", "7", "9"], analysis: "解析：标准的TCP/IP模型包含网络接口层、网际层、传输层和应用层共4层 [cite: 48]。" },
            { q: "TCP/IP模型中，对应OSI模型物理层和数据链路层的是？", a: "网络接口层", ops: ["应用层", "传输层", "网络层", "网络接口层"], analysis: "解析：TCP/IP的最底层网络接口层整合了物理连接与链路控制的功能 [cite: 49]。" },

    let currentChIdx = -1;
    let currentQIdx = 0;
    let sessionScore = 0;

    window.onload = function() {
        const name = localStorage.getItem('user_name');
        if (name) showMain(name);
        
        document.getElementById('user-name-input').onkeydown = e => { if(e.key==='Enter') login(); };
    };

    function login() {
        const name = document.getElementById('user-name-input').value.trim();
        if (!name) return alert("请输入姓名");
        localStorage.setItem('user_name', name);
        showMain(name);
    }

    function logout() {
        if (confirm("将清除所有姓名记录和刷题最高分，确定吗？")) {
            localStorage.clear();
            location.reload();
        }
    }

    function showMain(name) {
        document.getElementById('page-login').style.display = 'none';
        document.getElementById('main-header').style.visibility = 'visible';
        document.getElementById('display-name').innerText = name;
        goHome();
    }

    function renderMenu() {
        const list = document.getElementById('chapter-list');
        list.innerHTML = '';
        database.forEach((ch, idx) => {
            const best = localStorage.getItem(`ch_${idx}_best`) || 0;
            const card = document.createElement('div');
            card.className = 'chapter-card';
            card.innerHTML = `
                <div class="chapter-info">
                    <h3>${ch.name}</h3>
                    <div class="high-score">历史最高分：${best}</div>
                </div>
                <button class="start-btn" onclick="startChapter(${idx})">进入</button>
            `;
            list.appendChild(card);
        });
    }

    function startChapter(idx) {
        currentChIdx = idx;
        currentQIdx = 0;
        sessionScore = 0;
        showPage('page-quiz');
        renderQuestion();
    }

    function renderQuestion() {
        const qData = database[currentChIdx].questions[currentQIdx];
        document.getElementById('q-text').innerText = (currentQIdx + 1) + ". " + qData.q;
        document.getElementById('q-indicator').innerText = (currentQIdx + 1) + "/" + database[currentChIdx].questions.length;
        document.getElementById('progress').style.width = ((currentQIdx+1)/database[currentChIdx].questions.length*100) + "%";
        
        document.getElementById('analysis-box').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';

        const opsBox = document.getElementById('options');
        opsBox.innerHTML = '';
        qData.ops.forEach(opt => {
            const btn = document.createElement('div');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = function() { handleSelect(this, qData.a, qData.analysis); };
            opsBox.appendChild(btn);
        });
    }

    function handleSelect(btn, correct, analysis) {
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.classList.add('disabled'));
        
        const isRight = btn.innerText === correct;
        if (isRight) {
            btn.classList.add('correct');
            sessionScore++;
        } else {
            btn.classList.add('wrong');
            allBtns.forEach(b => { if(b.innerText === correct) b.classList.add('correct'); });
        }

        const ab = document.getElementById('analysis-box');
        ab.style.display = 'block';
        ab.className = 'analysis-card ' + (isRight ? 'correct-analysis' : 'wrong-analysis');
        document.getElementById('analysis-head').innerText = isRight ? "✔ 回答正确" : "✘ 回答错误";
        document.getElementById('analysis-body').innerText = analysis;
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQIdx++;
        if (currentQIdx < database[currentChIdx].questions.length) {
            renderQuestion();
        } else {
            const lastBest = parseInt(localStorage.getItem(`ch_${currentChIdx}_best`) || 0);
            if (sessionScore > lastBest) localStorage.setItem(`ch_${currentChIdx}_best`, sessionScore);
            alert(`本章测试结束！本次得分：${sessionScore}`);
            goHome();
        }
    }

    function goHome() {
        showPage('page-home');
        renderMenu();
    }

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.getElementById(id).classList.add('active-page');
    }
</script>
